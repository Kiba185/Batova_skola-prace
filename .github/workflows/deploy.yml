name: Deploy to Endora

on:
  push:
    branches:
      - main  # nebo master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Stáhne obsah repozitáře
      - name: Checkout repo
        uses: actions/checkout@v3

      # 2️⃣ Nahraje soubory na Endora FTP
      - name: Upload to Endora FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./               # root tvého repa
          server-dir: /bataskola.hys.cz/web/  # root složka na Endoře
          git-ftp-args: --insecure   # pokud by byl problém s certifikáty
